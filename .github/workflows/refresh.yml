# Refreshes the Shark Tracker data on a schedule.
# GitHub may start scheduled runs a few minutes late; that's normal.
name: refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started this run"
        required: false
        default: "manual"

# Never run two refreshes at once; a new one waits for the old one.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      # Skip quietly until the INGEST_KEY secret has been added.
      - id: check
        env:
          KEY: ${{ secrets.INGEST_KEY }}
        run: echo "ready=$([ -n "$KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready == 'yes'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'yes'
        run: pip install requests==2.32.3
      - name: Refresh data
        if: steps.check.outputs.ready == 'yes'
        env:
          SITE_URL: https://shark-tracker.fundingmysonstrust.workers.dev
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger || github.event_name }}
        run: python -m collector.run_remote
      # Keep going: start the next refresh as soon as this one ends (after a short
      # pause), so data stays as fresh as the ~9 minute run time allows.
      # The schedule above stays as a safety net if the chain ever breaks.
      - name: Queue next refresh
        if: always() && steps.check.outputs.ready == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sleep 45
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/refresh.yml/dispatches" -f ref="${{ github.ref_name }}" -f "inputs[trigger]=chain"
