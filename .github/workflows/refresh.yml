# Refreshes the Shark Tracker data on a schedule.
# GitHub may start scheduled runs a few minutes late; that's normal.
name: refresh

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      trigger:
        description: "Who started this run"
        required: false
        default: "manual"

# Never run two refreshes at once; a new one waits for the old one.
concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      # Skip quietly until the INGEST_KEY secret has been added.
      - id: check
        env:
          KEY: ${{ secrets.INGEST_KEY }}
        run: echo "ready=$([ -n "$KEY" ] && echo yes || echo no)" >> "$GITHUB_OUTPUT"
      - if: steps.check.outputs.ready == 'yes'
        uses: actions/checkout@v4
      - if: steps.check.outputs.ready == 'yes'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - if: steps.check.outputs.ready == 'yes'
        run: pip install requests==2.32.3
      - name: Refresh data
        if: steps.check.outputs.ready == 'yes'
        env:
          SITE_URL: https://shark-tracker.fundingmysonstrust.workers.dev
          INGEST_KEY: ${{ secrets.INGEST_KEY }}
          TRIGGER: ${{ github.event_name == 'schedule' && 'github-schedule' || inputs.trigger || github.event_name }}
        run: python -m collector.run_remote
