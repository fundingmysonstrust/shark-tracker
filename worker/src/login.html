<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<meta name="robots" content="noindex, nofollow">
<title>Shark Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root { --bg:#070b14; --card:#0f1726; --ink:#e7ecf5; --mute:#8592a8; --line:#1d2940; --accent:#22d3ee; --accent2:#818cf8; --bad:#f87171; }
  * { box-sizing: border-box; }
  html { -webkit-tap-highlight-color: transparent; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; color:var(--ink); padding:16px;
         font:15px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
         background:radial-gradient(900px 500px at 20% 0%,rgba(34,211,238,.12),transparent 60%),radial-gradient(800px 500px at 100% 100%,rgba(129,140,248,.12),transparent 60%),var(--bg); }
  form { background:var(--card); border:1px solid var(--line); border-radius:18px; padding:30px; width:100%; max-width:380px; box-shadow:0 20px 50px rgba(0,0,0,.45); }
  .logo { width:44px; height:44px; border-radius:12px; display:grid; place-items:center; font-size:22px; margin-bottom:14px;
          background:linear-gradient(135deg,var(--accent),var(--accent2)); box-shadow:0 6px 20px rgba(34,211,238,.3); }
  h1 { margin:0 0 4px; font-size:22px; font-weight:800; letter-spacing:-.02em; }
  p { margin:0 0 20px; color:var(--mute); font-size:14px; }
  input { width:100%; font:inherit; padding:12px 14px; border:1px solid #263452; border-radius:11px; background:#0b1220; color:var(--ink); outline:none; }
  input:focus { border-color:var(--accent); box-shadow:0 0 0 3px rgba(34,211,238,.2); }
  button { width:100%; margin-top:12px; font:inherit; font-weight:700; padding:12px; border:0; border-radius:11px; color:#06101f; cursor:pointer; touch-action:manipulation; transition:transform 160ms cubic-bezier(0.23,1,0.32,1);
           background:linear-gradient(135deg,var(--accent),var(--accent2)); }
  button:active { transform:scale(0.97); }
  input { font-size:16px; }
  .err { color:var(--bad); margin:10px 0 0; font-size:14px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo">🦈</div>
  <h1>Shark Tracker</h1>
  <p>Enter the password to continue.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <!--ERR-->
  <button type="submit">Open</button>
</form>
</body>
</html>
