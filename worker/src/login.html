<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Shark Tracker</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#15181d; --mute:#5d6673; --line:#dde1e6; --accent:#1f6feb; --bad:#c62828; }
  @media (prefers-color-scheme: dark) { :root { --bg:#0f1115; --card:#181b21; --ink:#e8eaee; --mute:#9aa3ae; --line:#2a2f37; --accent:#4c8dff; --bad:#ff6b6b; } }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; padding:16px; }
  form { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:28px; width:100%; max-width:360px; }
  h1 { margin:0 0 4px; font-size:22px; }
  p { margin:0 0 18px; color:var(--mute); font-size:14px; }
  input { width:100%; font:inherit; padding:12px; border:1px solid var(--line); border-radius:10px; background:var(--bg); color:var(--ink); }
  button { width:100%; margin-top:12px; font:inherit; font-weight:600; padding:12px; border:0; border-radius:10px; background:var(--accent); color:#fff; cursor:pointer; }
  .err { color:var(--bad); margin:10px 0 0; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>🦈 Shark Tracker</h1>
  <p>Enter the password to continue.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <!--ERR-->
  <button type="submit">Open</button>
</form>
</body>
</html>
