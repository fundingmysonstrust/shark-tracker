<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d0e10">
<meta name="robots" content="noindex, nofollow">
<title>Shark Tracker</title>
<style>
  :root { --bg:#0d0e10; --panel:#131417; --ink:#e8e8ea; --mute:#9a9ca3; --line:#24262b; --line2:#30333a; --accent:#7aa2f7; --bad:#e06c6c; }
  * { box-sizing:border-box; }
  html { -webkit-tap-highlight-color:transparent; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:16px; background:var(--bg); color:var(--ink);
         font:14px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif; }
  form { width:100%; max-width:340px; }
  h1 { margin:0 0 2px; font-size:17px; font-weight:650; letter-spacing:-.01em; }
  p { margin:0 0 20px; color:var(--mute); font-size:13px; }
  input { width:100%; font:inherit; font-size:16px; padding:10px 12px; border:1px solid var(--line2); border-radius:6px; background:var(--panel); color:var(--ink); outline:none; }
  input:focus { border-color:var(--accent); }
  button { width:100%; margin-top:10px; font:inherit; font-weight:600; padding:10px; border:0; border-radius:6px; background:var(--ink); color:var(--bg);
           cursor:pointer; touch-action:manipulation; transition:transform 160ms cubic-bezier(0.23,1,0.32,1); }
  button:active { transform:scale(0.97); }
  .err { color:var(--bad); margin:10px 0 0; font-size:13px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Shark Tracker</h1>
  <p>Enter the password to continue.</p>
  <input type="password" name="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <!--ERR-->
  <button type="submit">Continue</button>
</form>
</body>
</html>
